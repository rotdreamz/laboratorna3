<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>{% block title %}{% endblock %} - Мандруємо Волинню</title>
</head>
<body class="bg-emerald-50 text-gray-800">

    <!-- Меню: на вузьких екранах пункти переносяться на новий рядок -->
    <header class="bg-emerald-800 text-white">
        <nav class="max-w-4xl mx-auto p-4 flex flex-wrap gap-4">
            <a href="{{ url_for('index') }}" class="font-bold">Мандруємо Волинню</a>
            <a href="{{ url_for('index') }}" class="hover:underline">Головна</a>
            <a href="{{ url_for('places') }}" class="hover:underline">Місця</a>
            <a href="{{ url_for('tips') }}" class="hover:underline">Поради</a>
            <a href="{{ url_for('about') }}" class="hover:underline">Про нас</a>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-sm text-gray-500 p-4">
        © 2026 Мандруємо Волинню. Навчальний проєкт.
    </footer>

</body>
</html>
